l_spanish:
 GEMINI_SYNC_TOOLTIP:0 "§HEnviar datos al Gabinete de Asesores§!\nTransmite la inteligencia nacional en tiempo real a tu Centro de Mando Web."

 # Categoría y Decisiones
 gemini_minister_category:0 "§H[🤖] Gabinete de Planificación Nacional IA§!"
 gemini_minister_category_desc:0 "§YDelega la microgestión de fábricas, logística y suministros a tus Asesores IA para enfocarte en el liderazgo supremo y la guerra.§!"
 
 gemini_toggle_autopilot:0 "⚙️ Alternar Piloto Automático Industrial"
 gemini_toggle_autopilot_desc:0 "El Ministro de Economía planificará y construirá automáticamente fábricas cada 30 días según las necesidades del país."
 
 gemini_autopilot_cycle:0 "🔄 Ministro de Economía: Asignando Obras Nacionales..."
 gemini_autopilot_cycle_desc:0 "El Asesor está evaluando estados con huecos libres y asignando construcciones."
 
 gemini_order_civs:0 "🏗️ Orden Ejecutiva: Expandir Complejo Industrial Civil"
 gemini_order_civs_desc:0 "Ordena la construcción inmediata de fábricas civiles en los mejores estados."
 
 gemini_order_mils:0 "⚔️ Orden Ejecutiva: Acelerar Producción Bélica Pesada"
 gemini_order_mils_desc:0 "Ordena la construcción inmediata de fábricas militares para rearmar al ejército."
 
 gemini_order_infra:0 "🛤️ Orden Ejecutiva: Modernizar Red de Logística y Transporte"
 gemini_order_infra_desc:0 "Construye infraestructura en estados con deficiencias de suministro."

 gemini_order_refinery:0 "🛢️ Orden Ejecutiva: Programa de Autarquía de Combustible"
 gemini_order_refinery_desc:0 "Comisiona una refinería sintética para asegurar caucho y petróleo independiente del mar."

 # Eventos Presidenciales Dinámicos por Ideología
 gemini_minister.1.t_democratic:0 "§HSeñor Presidente: Hora de Proteger la República§!"
 gemini_minister.1.d_democratic:0 "Señor Presidente, el Parlamento y nuestros analistas económicos confirman que nuestra base industrial civil es sólida. La tensión internacional crece y nuestras fuerzas armadas carecen de armamento moderno.\n\n¿Autoriza al Gabinete a reorientar la producción hacia fábricas militares para salvaguardar la libertad de nuestra nación?"

 gemini_minister.1.t_fascism:0 "§H¡Mi Líder Supremo! Es Hora del Rearme de la Patria§!"
 gemini_minister.1.d_fascism:0 "¡Mi Conductor! Nuestras fábricas civiles han establecido los cimientos de la patria. El destino de grandeza de nuestro pueblo exige armas, tanques y cañones para aplastar a cualquier enemigo exterior.\n\n¿Ordena la movilización militar total de nuestra industria pesada?"

 gemini_minister.1.t_communism:0 "§H¡Camarada Secretario General! Industrialización Proletaria de Guerra§!"
 gemini_minister.1.d_communism:0 "¡Camarada! El Plan Quinquenal de la clase obrera ha consolidado una infraestructura envidiable. El imperialismo internacional se prepara para la guerra y debemos armar al Ejército Rojo.\n\n¿Autoriza al Comité Central a dirigir todos los recursos a las fábricas de armamento del pueblo?"

 gemini_minister.1.t_neutrality:0 "§HSu Majestad: El Fortalecimiento de la Corona§!"
 gemini_minister.1.d_neutrality:0 "Su Majestad, los consejeros del Reino informan que las arcas y las obras civiles son prósperas. Sin embargo, los reinos vecinos se arman y nuestra soberanía tradicional corre peligro.\n\n¿Da su bendición real para forjar los arsenales que defenderán nuestras fronteras?"

 gemini_minister.1.a:0 "Proceda, Ministro. Priorice fábricas militares."
 gemini_minister.1.b:0 "Aún no. Sigamos expandiendo la economía civil."

 gemini_minister.2.t_democratic:0 "§HAlerta del Gabinete: Crisis de Caucho y Aviación§!"
 gemini_minister.2.d_democratic:0 "Señor Presidente, nuestras fábricas de cazas reportan falta crítica de caucho natural. Nuestras rutas marítimas mercantes son frágiles.\n\n¿Autoriza construir refinerías sintéticas en el interior del país?"

 gemini_minister.2.t_authoritarian:0 "§HInforme de Estado Mayor: Bloqueo de Recursos Estratégicos§!"
 gemini_minister.2.d_authoritarian:0 "¡Comandante! La aviación y los vehículos militares sufren escasez de caucho. No podemos depender de tratados marítimos con naciones extranjeras.\n\n¿Autoriza el despliegue inmediato de refinerías sintéticas nacionales?"

 gemini_minister.2.a:0 "Autorizado. Construyan refinerías de inmediato."
 gemini_minister.2.b:0 "No por ahora. Buscaremos comercio exterior."